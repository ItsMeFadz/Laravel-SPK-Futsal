version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker-prod/Dockerfile
    container_name: app-spk
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:8000"
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laravel_net
    volumes:
    - laravel_storage:/app/storage

volumes:
  laravel_storage:

networks:
  laravel_net:
    driver: bridge